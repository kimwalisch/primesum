name: ci

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches-ignore:
      - gh-pages

jobs:
  linux_gcc:
    strategy:
      matrix:
        platform: ['ubuntu-latest']
        config: ['Debug', 'Release']
    runs-on: ${{ matrix.platform }}
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
      - name: Build primesum
        run: |
            cmake . -DCMAKE_BUILD_TYPE=${{matrix.config}} -DCMAKE_C_FLAGS="-O3 -Wall -Wextra -pedantic -Werror" -DCMAKE_CXX_FLAGS="-O3 -Wall -Wextra -pedantic -Werror"
            cmake --build . --parallel --verbose
      - name: CTest (unit tests)
        run: ctest -j2 --output-on-failure
      - name: primesum --test
        run: ./primesum --test
      - name: primesum 1e12
        run: if [ "$(./primesum 1e12)" != "18435588552550705911377" ]; then exit 1; fi
      - name: primesum 1e14
        run: if [ "$(./primesum 1e14)" != "157589260710736940541561021" ]; then exit 1; fi

  linux_clang:
    strategy:
      matrix:
        platform: ['ubuntu-latest']
        config: ['Debug', 'Release']
    runs-on: ${{ matrix.platform }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
            sudo apt update
            sudo apt install libomp-dev
      - name: Build primesum
        run: |
            cmake . -DCMAKE_BUILD_TYPE=${{matrix.config}} -DCMAKE_C_FLAGS="-O3 -Wall -Wextra -pedantic -Werror" -DCMAKE_CXX_FLAGS="-O3 -Wall -Wextra -pedantic -Werror"
            cmake --build . --parallel --verbose
      - name: CTest (unit tests)
        run: ctest -j2 --output-on-failure
      - name: primesum --test
        run: ./primesum --test
      - name: primesum 1e12
        run: if [ "$(./primesum 1e12)" != "18435588552550705911377" ]; then exit 1; fi
      - name: primesum 1e14
        run: if [ "$(./primesum 1e14)" != "157589260710736940541561021" ]; then exit 1; fi

  # See documentation: https://www.msys2.org/docs/ci/
  windows_mingw64:
    strategy:
      matrix:
        platform: ['windows-latest']
        config: ['Debug', 'Release']
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
      - name: Build primesum
        run: |
            cmake . -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{matrix.config}} -DCMAKE_C_FLAGS="-O3 -Wall -Wextra -pedantic -Werror" -DCMAKE_CXX_FLAGS="-O3 -Wall -Wextra -pedantic -Werror"
            cmake --build . --parallel --verbose
      - name: CTest (unit tests)
        run: ctest -j2 --output-on-failure
      - name: primesum --test
        run: ./primesum --test
      # Test printing primes. Native Windows stdout uses CRLF, so strip CR
      # before calculating the MD5 hash used by the Unix CI jobs.
      - name: primesum 1e12
        run: if [ "$(./primesum 1e12 | tr -d '\r')" != "18435588552550705911377" ]; then exit 1; fi
      - name: primesum 1e14
        run: if [ "$(./primesum 1e14 | tr -d '\r')" != "157589260710736940541561021" ]; then exit 1; fi

  macos_clang:
    strategy:
      matrix:
        platform: ['macos-latest']
        config: ['Debug', 'Release']
    runs-on: ${{ matrix.platform }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install libomp
      - name: Build primesum
        run: |
            cmake . -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{matrix.config}} -DCMAKE_C_FLAGS="-O3 -Wall -Wextra -pedantic -Werror" -DCMAKE_CXX_FLAGS="-O3 -Wall -Wextra -pedantic -Werror"
            cmake --build . --parallel --verbose
      - name: CTest (unit tests)
        run: ctest -j2 --output-on-failure
      - name: primesum --test
        run: ./primesum --test
      - name: primesum 1e12
        run: if [ "$(./primesum 1e12)" != "18435588552550705911377" ]; then exit 1; fi
      - name: primesum 1e14
        run: if [ "$(./primesum 1e14)" != "157589260710736940541561021" ]; then exit 1; fi

  linux_gcc_sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
      - name: Build primesum
        run: |
            cmake . -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic -Werror -O2 -g -fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-Wall -Wextra -pedantic -Werror -O2 -g -fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
            cmake --build . --parallel --verbose
      - name: CTest (unit tests)
        run: ctest -j2 --output-on-failure
      - name: primesum --test
        run: ./primesum --test
      - name: primesum 1e3
        run: ./primesum 1e3
      - name: primesum 1e5
        run: ./primesum 1e5
      - name: primesum 1e8
        run: ./primesum 1e8
      - name: primesum 1e13
        run: ./primesum 1e13

  linux_gcc_valgrind:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
      - name: Install valgrind
        run: |
            sudo apt update
            sudo apt install valgrind
      - name: Build primesum
        run: |
            cmake . -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic -Werror -g" -DCMAKE_CXX_FLAGS="-Wall -Wextra -pedantic -Werror -g"
            cmake --build . --parallel --verbose
      - name: Valgrind primesum 1e3
        run: valgrind --error-exitcode=1 ./primesum 1e3
      - name: Valgrind primesum 1e5
        run: valgrind --error-exitcode=1 ./primesum 1e5
      - name: Valgrind primesum 1e8
        run: valgrind --error-exitcode=1 ./primesum 1e8
      - name: Valgrind primesum 1e12
        run: valgrind --error-exitcode=1 ./primesum 1e12
